<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Route Tracker — Entregas</title>
<meta name="theme-color" content="#10141A" />
<meta name="description" content="Lista de entregas do dia, com mapa e sincronização offline." />
<link rel="manifest" href="/pwa/manifest.json" />
<link rel="icon" href="/pwa/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/pwa/icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
<link rel="stylesheet" href="/pwa/css/pwa.css" />
</head>
<body>
<div id="app">

  <!-- Screen 1: Scanner -->
  <section id="scannerScreen" class="screen">
    <h1>Route Tracker — Entregas</h1>
    <p>Digitaliza o código QR partilhado pela ferramenta de rotas para carregares as tuas entregas de hoje.</p>
    <div class="scanner-video-wrap" id="scannerVideoWrap">
      <video id="video" playsinline muted></video>
      <div class="scan-frame"></div>
    </div>
    <canvas id="canvas"></canvas>
    <button id="scanStartBtn" class="btn-big">📷 Ler código QR</button>
    <div id="scanError" class="error-banner" hidden></div>
  </section>

  <!-- Screen 2: Stop list -->
  <section id="listScreen" class="screen" hidden>
    <header class="list-header">
      <div class="header-row">
        <div class="counters">
          <div class="counter counter-pending"><span class="num" id="countPending">0</span><span class="lbl">Por entregar</span></div>
          <div class="counter counter-done"><span class="num" id="countDone">0</span><span class="lbl">Concluídas</span></div>
        </div>
        <button class="icon-btn-header" id="rescanBtn" title="Carregar nova rota">📷</button>
      </div>
      <button id="syncBadgeBtn" class="sync-badge" hidden><span id="syncCount">0</span> por sincronizar — toca para tentar agora</button>
    </header>
    <div id="expiredBanner" class="warn-banner" hidden>Esta rota expirou — as novas marcações podem não sincronizar.</div>
    <div id="listPending" class="stop-section"></div>
    <div class="stop-section-header" id="doneHeader" hidden>Concluídas (<span id="countDone2">0</span>)</div>
    <div id="listDone" class="stop-section"></div>
  </section>

  <!-- Screen 3: Map -->
  <section id="mapScreen" class="screen" hidden>
    <div id="mapContainer"></div>
    <button id="locateBtn" class="map-locate-btn" title="Centrar na minha localização">🎯</button>
  </section>

  <!-- Bottom nav -->
  <nav id="bottomNav" hidden>
    <button id="navList" class="nav-btn active"><span class="nav-icon">📋</span>Lista</button>
    <button id="navMap" class="nav-btn"><span class="nav-icon">🗺️</span>Mapa</button>
  </nav>

  <!-- "Fechar paragem?" modal -->
  <div id="stopModal" class="modal-overlay" hidden>
    <div class="modal">
      <h2 id="modalAddress"></h2>
      <div class="modal-meta" id="modalMeta"></div>
      <div class="modal-question">Fechar paragem?</div>
      <div class="modal-actions">
        <button id="modalDeliveredBtn" class="btn-ok-lg">✓ Entregue</button>
        <button id="modalFailedBtn" class="btn-fail-lg">✗ Falhou</button>
        <button id="modalCancelBtn" class="btn-ghost-lg">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Fail-reason modal -->
  <div id="reasonModal" class="modal-overlay" hidden>
    <div class="modal">
      <h2>Motivo</h2>
      <div class="reason-options">
        <button class="reason-opt" data-reason="Ninguém em casa">Ninguém em casa</button>
        <button class="reason-opt" data-reason="Endereço não encontrado">Endereço não encontrado</button>
        <button class="reason-opt" data-reason="Recusado pelo cliente">Recusado pelo cliente</button>
        <button class="reason-opt" data-reason="Sem acesso / portão fechado">Sem acesso / portão fechado</button>
        <button class="reason-opt" data-reason="Outro">Outro</button>
      </div>
      <input id="reasonFreeText" type="text" placeholder="Detalhes (opcional)" hidden />
      <div class="modal-actions">
        <button id="reasonConfirmBtn" class="btn-fail-lg">Confirmar</button>
        <button id="reasonCancelBtn" class="btn-ghost-lg">Cancelar</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <div id="loadingOverlay" hidden>A carregar rota…</div>
</div>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="/pwa/js/config.js"></script>
<script src="/pwa/js/db.js"></script>
<script src="/pwa/js/sync.js"></script>
<script src="/pwa/js/scanner.js"></script>
<script src="/pwa/js/list.js"></script>
<script src="/pwa/js/map.js"></script>
<script src="/pwa/js/app.js"></script>
</body>
</html>
